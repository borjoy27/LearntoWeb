<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="desc"></p>
    <h1>헤딩태그</h1>
    <h2>제목2</h2>
    <h3>제목3</h3>

    <hr />
    <h1>p태그</h1>
    <p>안녕하세요. 저는 누구입니다.</p>

    <hr />
    <h1>br태그</h1>
    <p>
        안녕하세요. 여기서 줄바꿀게요 <br />
        여기입니다
    </p>

    <hr />
    <h1>i, em, b, strong</h1>
    <i>i태그</i>
    <em>em태그</em>
    <b>b태그</b>
    <strong>strong태그</strong>

    <hr />
    <h1>순서가 있는 목록, ol</h1>
    <h2>요리 레시피를 생각하세요!</h2>
    <ol>
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ol>

    <hr />
    <h1>순서가 없는 목록, ul</h1>
    <ul>
        <li>하나</li>
        <li>둘</li>
        <li>셋</li>
    </ul>

    <hr />
    <dl>
        <dt>이름</dt>
        <dd>이기쁨</dd>
        <dt>주소</dt>
        <dd>제주시</dd>
    </dl>

    <hr />
    <h1>테이블 기본태그</h1>
    <table>
        <caption>
            표제목
        </caption>
        <thead>
            <tr>
                <th>상품명</th>
                <th>가격</th>
            </tr>    
        </thead>
        <tbody>
            <tr>
                <th>사과</th>
                <th>5000원</th>
            </tr>
            <tr>
                <th>귤</th>
                <th>1000원</th>
            </tr>
            <tr>
                <td colspan="2">합쳐짐</td>
            </tr>
        </tbody>
    </table>





</body>
</html>
